<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Gelu's Collection: la collezione dei tuoi videogiochi, digitali e fisici, su tutte le console.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Gelu's Collection</title>
<meta name="theme-color" content="#14121F">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: app a una colonna; header in alto, schede in basso, pulsante + flottante */
:root{
  --bg:#F1F0F7; --surface:#FFFFFF; --sunk:#E6E3F1; --ink:#1B1830; --muted:#615C78; --line:#DAD6EA;
  --accent:#5A48E0; --accent-ink:#FFFFFF; --accent-soft:#E4E0FC; --gold:#E9B44C; --tomato:#E4572E; --mint:#3BA88E;
  --ok:#2E7D5B; --warn:#A8690F; --warn-soft:#FBEBCF; --bad:#C2412D; --bad-soft:#F8DDD7;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:14px; --nav-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#110F1C; --surface:#1B1829; --sunk:#151223; --ink:#ECE9F7; --muted:#9C97B4; --line:#2D2942;
  --accent:#9D90FF; --accent-ink:#14121F; --accent-soft:#2A2550; --gold:#E9B44C; --tomato:#F07A5A; --mint:#5CC4A8;
  --ok:#5CC491; --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#110F1C; --surface:#1B1829; --sunk:#151223; --ink:#ECE9F7; --muted:#9C97B4; --line:#2D2942;
  --accent:#9D90FF; --accent-ink:#14121F; --accent-soft:#2A2550; --gold:#E9B44C; --tomato:#F07A5A; --mint:#5CC4A8;
  --ok:#5CC491; --warn:#E9B44C; --warn-soft:#3A2E16; --bad:#F07A63; --bad-soft:#3D1F1A; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
  padding-block:12px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-mark{width:30px;height:30px;border-radius:8px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:clamp(17px,4.8vw,20px);margin:0;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-install{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 12px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:14px;flex:none}
.btn-install svg{width:16px;height:16px}
.hdr-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink)}
.hdr-btn svg{width:20px;height:20px}
.hdr-btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media (max-width:340px){.brand-mark{display:none}}

main{max-width:640px;margin:0 auto;padding-block:14px calc(var(--nav-h) + 96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}

.sample-note{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);border-radius:var(--r);padding:10px 14px;font-size:14px}
.sample-note button{border:0;background:transparent;color:var(--warn);font-weight:600;padding:4px 0;text-decoration:underline}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .c{font-size:12px;opacity:.7}
.chip.add{border-style:dashed;color:var(--accent);font-weight:600}
.wrapchips{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}

.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
.filters select{width:100%;min-width:0;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:14px}

.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.hero div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero b{font-family:var(--f-display);font-size:24px;font-weight:600;line-height:1.1}
.hero small{font-size:12px;color:var(--muted)}

section.block{display:flex;flex-direction:column;gap:8px}
.block-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.block-head h3{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:8px}
.linkbtn{color:var(--accent);font-weight:600;font-size:14px;border:0;background:none;padding:0}
.empty{color:var(--muted);font-size:14px;padding:16px;border:1px dashed var(--line);border-radius:var(--r);text-align:center}
.count{font-size:13px;color:var(--muted)}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.g{display:flex;align-items:center;gap:12px;padding:11px 12px;border-top:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.g:first-child{border-top:0}
.tile{width:42px;height:42px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;font-family:var(--f-num);font-size:11px;font-weight:600;letter-spacing:-.02em;line-height:1;text-align:center;padding:2px;overflow:hidden}
.cov{position:relative;width:42px;height:54px;flex:none;border-radius:8px;overflow:hidden;background:var(--sunk)}
.cov img{width:100%;height:100%;object-fit:cover;display:block}
.cov i{position:absolute;right:3px;bottom:3px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.photo{display:flex;flex-direction:column;gap:8px;align-items:center}
.photo img{max-width:100%;max-height:260px;border-radius:12px;object-fit:contain;cursor:zoom-in;background:var(--sunk)}
.photo .btnrow{width:100%}
.photo-add{display:flex;align-items:center;justify-content:center;gap:8px;border:1px dashed var(--line);border-radius:12px;padding:14px;background:var(--surface);color:var(--accent);font-weight:600;cursor:pointer;width:100%}
.photo-add svg{width:20px;height:20px}
#viewer{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.9);display:grid;place-items:center;padding:16px}
#viewer img{max-width:100%;max-height:100%;border-radius:8px}
.gridv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 10px}
@media (min-width:520px){.gridv{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gc{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;color:inherit}
.gc .cv{aspect-ratio:3/4;width:100%;max-width:100%;border-radius:10px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:#fff;padding:8px;text-align:center;font-weight:700;font-size:13px;line-height:1.2;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.gc .cv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.gc .cv .ttl{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gc .cv .sg{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.6);color:#fff;font-family:var(--f-num);font-size:10px;padding:2px 6px;border-radius:6px}
.gc .cv .pill{position:absolute;left:5px;top:5px;font-size:9px;padding:1px 6px}
.gc .tt{font-size:13px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.vt{display:flex;gap:4px;background:var(--sunk);border-radius:10px;padding:3px}
.vt button{border:0;background:none;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.vt button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.countrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.more{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px}
.more summary{padding:12px 0;font-weight:600;cursor:pointer;color:var(--accent);list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"+ "}
.more[open] summary::before{content:"− "}
.more[open]{padding-bottom:14px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-radius:var(--r);padding:10px 14px;font-size:14px;background:var(--warn-soft)}
.banner.info{background:var(--accent-soft)}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;text-decoration:underline;padding:4px 0}
.wrapped{background:linear-gradient(150deg,#14121F,#3A2F8F 45%,#FF4F8B);color:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.wrapped h2{color:#fff}
.wrapped .wk{font-size:12px;text-transform:uppercase;letter-spacing:.1em;opacity:.8;font-weight:600}
.wrapped .wb{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.05}
.wrapped .wg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.wrapped .wc{background:rgba(255,255,255,.12);border-radius:14px;padding:12px;min-width:0}
.wrapped .wc b{display:block;font-family:var(--f-display);font-size:22px;overflow-wrap:anywhere}
.wrapped ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.g .main{flex:1;min-width:0}
.g .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g .s{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;margin-top:2px}
.g .r{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:none;font-size:12px;color:var(--muted)}
.stars{color:var(--gold);letter-spacing:1px;font-size:12px;white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.03em;padding:2px 8px;border-radius:999px;text-transform:uppercase;white-space:nowrap}
.st-da{background:var(--sunk);color:var(--muted)}
.st-corso{background:var(--accent-soft);color:var(--accent)}
.st-finito{background:#D6EEDF;color:#23704A}
.st-cento{background:#FBEBCF;color:#8A5A0B}
.st-mollato{background:var(--bad-soft);color:var(--bad)}
.st-pausa{background:var(--warn-soft);color:var(--warn)}
.st-wish{background:#F7DDEB;color:#A33B70}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st-finito{background:#173A2A;color:#5CC491}:root:not([data-theme="light"]) .st-cento{background:#3A2E16;color:#E9B44C}:root:not([data-theme="light"]) .st-wish{background:#3A1A2C;color:#F08CBC}}
:root[data-theme="dark"] .st-finito{background:#173A2A;color:#5CC491}
:root[data-theme="dark"] .st-cento{background:#3A2E16;color:#E9B44C}
:root[data-theme="dark"] .st-wish{background:#3A1A2C;color:#F08CBC}
.tag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}

.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.wide{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h4{margin:0;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:14px}
.settings{display:flex;flex-direction:column;gap:12px}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

.pick{background:linear-gradient(135deg,#14121F 0%,#3A2F8F 55%,#7C6CFF 100%);color:#fff;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;border:0;text-align:left}
.pick h2{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.15}
.pick p{margin:0;opacity:.9;font-size:14px}

.bars{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.brow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;font-size:14px}
.brow .bar{grid-column:1/-1;height:8px;border-radius:999px;background:var(--sunk);overflow:hidden;display:flex}
.brow .bar span{display:block;height:100%}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-size:20px;font-family:var(--f-display);font-weight:600}
.stat small{color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.fab{position:fixed;z-index:21;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 6px 18px rgba(60,40,200,.35)}
.fab svg{width:26px;height:26px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));
  display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;height:var(--nav-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent);font-weight:600}

.scrim{position:fixed;inset:0;z-index:40;background:rgba(12,10,22,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet h2{font-family:var(--f-display);font-weight:600;font-size:22px;margin:0;overflow-wrap:anywhere}
.sheet p{margin:0;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.field textarea{min-height:150px}
.field textarea.mono{font-family:var(--f-num);font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.err{color:var(--bad);font-size:13px;min-height:1em}
.rate{display:flex;gap:4px}
.rate button{width:42px;height:42px;border:0;background:none;font-size:28px;line-height:1;color:var(--line);padding:0}
.rate button.on{color:var(--gold)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg);box-shadow:0 0 0 1px var(--line)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.crow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .main{flex:1;min-width:0}
.crow .t{font-weight:600}
.crow .s{font-size:12px;color:var(--muted)}
.ed{width:36px;height:36px;border:0;background:none;border-radius:50%;display:grid;place-items:center;color:var(--muted);flex:none}
.ed svg{width:17px;height:17px}

.playing{position:sticky;top:calc(env(safe-area-inset-top,0px) + 62px);z-index:15;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);border-radius:var(--r);padding:10px 12px 10px 14px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.playing .main{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.playing .tm{font-family:var(--f-num);font-weight:600;font-size:16px;color:var(--gold)}
.playing button{border:0;border-radius:999px;padding:7px 14px;background:var(--tomato);color:#fff;font-weight:700;flex:none}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--tomato);flex:none;animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.sess{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.sess .big{font-family:var(--f-display);font-size:24px;font-weight:600}
.sess ul{list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.sess li{display:flex;justify-content:space-between}
.toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 90px + env(safe-area-inset-bottom,0px));

function seed(){
  const cons = CONSOLE_PRESET.map(([id, nome, sigla, col]) => ({id, nome, sigla, col, mia:['ps5','ps4','nsw','steam','epic','xsx'].includes(id)}));

  const G = (titolo, con, formato, origine, stato, extra = {}) => ({id:uid(), titolo, con, formato, origine, stato, account:'', durata:null, sessioni:[], voto:0, ore:null, prezzo:null, data:null, inizio:null, fine:null, genere:'', note:'', abbo:'', pref:false, agg:new Date().toISOString(), esempio:true, ...extra});

    G('Stray', 'ps5', 'digitale', 'abbonamento', 'finito', {account:'PSN principale', durata:6, abbo:'PS Plus', voto:4, ore:6, fine:d(200), genere:'Avventura'}),
    G('Ghost of Tsushima', 'ps5', 'digitale', 'abbonamento', 'da', {account:'PSN principale', durata:30, esce:dn(10), abbo:'PS Plus', genere:'Azione'}),

    G('The Legend of Zelda: Breath of the Wild', 'nsw', 'fisico', 'acquisto', 'finito', {saga:'The Legend of Zelda', sagaN:1, voto:5, ore:95, fine:d(500), genere:'Avventura'}),
    G('The Legend of Zelda: Tears of the Kingdom', 'nsw', 'fisico', 'acquisto', 'corso', {saga:'The Legend of Zelda', sagaN:2, sessioni:[{data:d(48), min:120}], ore:63, prezzo:59.99, data:d(400), inizio:d(380), genere:'Avventura', pref:true}),
    G('Mario Kart 8 Deluxe', 'nsw', 'digitale', 'acquisto', 'finito', {multi:['solo','locale','online'], racc:['r-coppia'], dlc:['Pass percorsi aggiuntivi'], voto:4, ore:40, prezzo:49.99, genere:'Corse'}),
    G('Metroid Dread', 'nsw', 'digitale', 'acquisto', 'da', {account:'Nintendo di casa', durata:9, prezzo:29.99, data:d(250), genere:'Azione'}),
    G('Hades', 'nsw', 'digitale', 'acquisto', 'finito', {voto:5, ore:35, prezzo:12.49, fine:d(150), genere:'Indie'}),
    G('Animal Crossing: New Horizons', 'nsw', 'fisico', 'regalo', 'mollato', {racc:['r-relax'], multi:['solo','locale','online'], ore:80, genere:'Simulazione'}),
    G('The Witcher 3', 'ps4', 'fisico', 'acquisto', 'mollato', {ore:20, prezzo:19.9, genere:'GdR'}),
    G("Baldur's Gate 3", 'steam', 'digitale', 'acquisto', 'corso', {ore:58, prezzo:59.99, data:d(200), inizio:d(60), genere:'GdR'}),
    G('Stardew Valley', 'steam', 'digitale', 'acquisto', 'finito', {multi:['solo','online'], racc:['r-coppia','r-relax'], voto:5, ore:90, prezzo:13.99, fine:d(100), genere:'Simulazione'}),
    G('Hollow Knight', 'steam', 'digitale', 'acquisto', 'da', {saga:'Hollow Knight', sagaN:1, durata:28, prezzo:7.49, data:d(320), genere:'Indie'}),
    G('Cyberpunk 2077', 'steam', 'digitale', 'acquisto', 'da', {durata:40, prezzo:24.99, data:d(180), genere:'GdR'}),
    G('Celeste', 'epic', 'digitale', 'gratis', 'da', {durata:8, genere:'Piattaforme'}),

  const abbonamenti = [{id:uid(), nome:'PS Plus', scade:dn(20)}, {id:uid(), nome:'Game Pass', scade:dn(5)}];
  return {v:1, obiettivo:{[String(new Date().getFullYear())]:12}, console:cons, giochi, raccolte, abbonamenti, tema:'auto', onboard:'pending'};

function migrate(o){
  if (!Array.isArray(o.console) || !o.console.length) o.console = CONSOLE_PRESET.map(([id, nome, sigla, col]) => ({id, nome, sigla, col, mia:false}));
  for (const [id, nome, sigla, col] of CONSOLE_PRESET) if (!o.console.some(c => c.id === id)) o.console.push({id, nome, sigla, col, mia:false});
  if (!Array.isArray(o.giochi)) o.giochi = [];
  o.giochi.forEach(g => { if (!Array.isArray(g.sessioni)) g.sessioni = []; if (g.account === undefined) g.account = ''; if (g.durata === undefined) g.durata = null; if (!ST[g.stato]) g.stato = 'da'; if (!ORN[g.origine]) g.origine = 'acquisto'; if (g.formato !== 'fisico') g.formato = 'digitale'; });
  if (!Array.isArray(o.raccolte)) o.raccolte = [];
  if (!Array.isArray(o.abbonamenti)) o.abbonamenti = [];
  if (!o.obiettivo || typeof o.obiettivo !== 'object') o.obiettivo = {};
  o.giochi.forEach(g => { if (!Array.isArray(g.racc)) g.racc = []; if (!Array.isArray(g.multi)) g.multi = []; if (!Array.isArray(g.dlc)) g.dlc = []; g.racc = g.racc.filter(r => o.raccolte.some(x => x.id === r)); });
  o.tema = o.tema || 'auto';
  if (o.sessione && !o.giochi.some(g => g.id === o.sessione.gid)) o.sessione = null;
  o.v = 1; return o;
}
function load(){
  try { const r = localStorage.getItem(KEY); if (r){ const o = JSON.parse(r); if (o && Array.isArray(o.giochi)){ S = migrate(o); return; } } } catch(_){}
  S = migrate(seed()); save();
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(_){} }
const hasSamples = () => S.giochi.some(g => g.esempio);

/* ---------- stato vista ---------- */

try { const vw = localStorage.getItem(KEY + '-view'); if (vw) V.view = vw; const t = localStorage.getItem(KEY + '-tab'); if (t) V.tab = t; const so = localStorage.getItem(KEY + '-sort'); if (so) V.sort = so; } catch(_){}

/* ---------- account, durata, sessioni ---------- */
const accounts = () => [...new Set(S.giochi.map(g => (g.account || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
const DUR = [{id:'tutte', nome:'Qualsiasi'}, {id:'breve', nome:'Una serata o due', test:h => h <= 8}, {id:'media', nome:'Qualche settimana', test:h => h > 8 && h <= 25}, {id:'lunga', nome:'Una lunga avventura', test:h => h > 25}];
const durOk = (g, d = V.dur) => d === 'tutte' || (g.durata > 0 && DUR.find(x => x.id === d).test(g.durata));
const fmtMin = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? `${h} h${r ? ` ${r} min` : ''}` : `${r} min`; };
const fmtClock = ms => { const m = Math.floor(ms / 60000), h = Math.floor(m / 60); return `${h}:${pad(m % 60)}`; };
function addSession(g, min, data){
  if (!(min > 0)) return;
  g.sessioni = g.sessioni || [];
  g.sessioni.push({data:data || today(), min:Math.round(min)});
  g.ore = Math.round(((g.ore || 0) + min / 60) * 10) / 10;
  if (g.stato === 'da'){ g.stato = 'corso'; g.inizio = g.inizio || (data || today()); }
  delete g.esempio;
}
function startTimer(g){
  const snap = snapshot();
  if (S.sessione && S.sessione.gid !== g.id){
    const old = S.giochi.find(x => x.id === S.sessione.gid), min = (Date.now() - S.sessione.start) / 60000;
    if (old && min >= 1) addSession(old, Math.min(min, 720), iso(new Date(S.sessione.start)));
  }
  S.sessione = {gid:g.id, start:Date.now()};
  if (g.stato === 'da'){ g.stato = 'corso'; g.inizio = today(); }
  save(); closeSheet(); render(); window.scrollTo(0, 0);
  toast(`Timer avviato: buona partita a ${g.titolo}!`); offerUndo(snap);
}
function stopSheet(){
  const ses = S.sessione; if (!ses) return;
  const g = S.giochi.find(x => x.id === ses.gid); if (!g){ S.sessione = null; save(); render(); return; }
  const min = Math.max(1, Math.round((Date.now() - ses.start) / 60000)), long = min > 600;
  openSheet(`<h2>${esc(g.titolo)}</h2><p>${long ? 'Il timer è rimasto acceso a lungo: forse hai dimenticato di fermarlo. Correggi i minuti se serve.' : 'Ecco quanto hai giocato.'}</p>
    <div class="grid2">
      <div class="field"><label for="ss-h">Ore</label><input id="ss-h" class="num" type="number" min="0" max="24" inputmode="numeric" value="${Math.floor(Math.min(min, 1440) / 60)}"></div>
      <div class="field"><label for="ss-m">Minuti</label><input id="ss-m" class="num" type="number" min="0" max="59" inputmode="numeric" value="${Math.min(min, 1440) % 60}"></div>
    </div>
    <div class="err" id="ss-err"></div>
    <button class="btn wide" id="ss-ok">Salva la sessione</button>
    <button class="btn ghost wide" id="ss-cont">Continuo a giocare</button>
    <button class="btn danger wide" id="ss-no">Scarta il timer</button>`, root => {
    const $r = q => root.querySelector(q);
    $r('#ss-ok').addEventListener('click', () => {
      const m = (parseInt($r('#ss-h').value, 10) || 0) * 60 + (parseInt($r('#ss-m').value, 10) || 0);
      if (!(m > 0)) return $r('#ss-err').textContent = 'Scrivi quanto hai giocato, oppure scarta il timer.';
      const snap = snapshot();
      addSession(g, m, iso(new Date(ses.start))); S.sessione = null;
      save(); closeSheet(); render(); toast(`${fmtMin(m)} a ${g.titolo} · in tutto ${Math.round(g.ore)} h`); offerUndo(snap);
    });
    $r('#ss-cont').addEventListener('click', closeSheet);
    twoTap($r('#ss-no'), 'Tocca di nuovo per scartarlo', () => { S.sessione = null; save(); closeSheet(); render(); toast('Timer scartato'); });
  });
}
function playingBar(){
  const ses = S.sessione; if (!ses) return '';
  const g = S.giochi.find(x => x.id === ses.gid); if (!g) return '';
  return `<div class="playing" role="status"><span class="pulse" aria-hidden="true"></span><span class="main">Stai giocando a <b>${esc(g.titolo)}</b></span><span class="tm" id="tmr">${fmtClock(Date.now() - ses.start)}</span><button data-act="stopTimer">Ferma</button></div>`;
}
setInterval(() => { const t = document.getElementById('tmr'); if (t && S && S.sessione) t.textContent = fmtClock(Date.now() - S.sessione.start); }, 15000);

let dbP = null;
function idb(){
  return dbP ||= new Promise((res, rej) => {
    try { const r = indexedDB.open('gelu-inc-gelus-collection-foto', 1); r.onupgradeneeded = () => r.result.createObjectStore('foto'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
    catch(e){ rej(e); }
  });
}
async function fotoLoadAll(){
  try {
    const db = await idb();
    await new Promise(res => {
      const st = db.transaction('foto').objectStore('foto'), req = st.openCursor();
      req.onsuccess = () => { const c = req.result; if (c){ FOTO.set(c.key, c.value); c.continue(); } else res(); };
      req.onerror = () => res();
    });
  } catch(_){}
}
async function fotoPut(id, data){ FOTO.set(id, data); const db = await idb(); return new Promise((res, rej) => { const tx = db.transaction('foto', 'readwrite'); tx.objectStore('foto').put(data, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
async function fotoDel(id){ FOTO.delete(id); try { const db = await idb(); db.transaction('foto', 'readwrite').objectStore('foto').delete(id); } catch(_){} }
function fotoCleanup(){ setTimeout(() => { for (const id of [...FOTO.keys()]) if (!S.giochi.some(g => g.id === id)) fotoDel(id); }, 8000); }
function compressImage(file, max = 640){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.78));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
function viewImage(src){
  const el = document.createElement('div'); el.id = 'viewer'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-label', 'Foto, tocca per chiudere');
  el.innerHTML = `<img src="${src}" alt="">`; el.addEventListener('click', () => el.remove()); document.body.appendChild(el);
}

const abboOf = name => S.abbonamenti.find(a => norm(a.nome) === norm(name));
const leaving = (days = 30) => library().filter(g => g.origine === 'abbonamento' && g.esce && (g.stato === 'da' || g.stato === 'corso') && daysTo(g.esce) <= days && daysTo(g.esce) >= -3).sort((a, b) => a.esce.localeCompare(b.esce));
const BIL_KEY = 'gelu-inc-bilancino-v1', BIL_INBOX = 'gelu-inc-bilancino-inbox';
const bilOn = () => { try { return localStorage.getItem(BIL_KEY) !== null; } catch(_){ return false; } };
function sendToBil(g){
  if (!(g.prezzo > 0)) return false;
  try {
    const a = JSON.parse(localStorage.getItem(BIL_INBOX) || '[]');
    a.push({id:'gc-' + g.id, data:g.data || today(), importo:g.prezzo, descr:`Gioco: ${g.titolo}`, cat:'svago', note:`${conOf(g.con).nome}${g.formato === 'fisico' ? ', fisico' : ', digitale'}`, app:APP});
    localStorage.setItem(BIL_INBOX, JSON.stringify(a));
    g.bil = true; return true;
  } catch(_){ return false; }
}
const lastPlay = g => [g.inizio, g.ripreso, ...(g.sessioni || []).map(x => x.data)].filter(Boolean).sort().pop() || null;
const stale = () => library().filter(g => g.stato === 'corso').map(g => ({g, last:lastPlay(g)})).filter(x => x.last && daysTo(x.last) <= -30).sort((a, b) => a.last.localeCompare(b.last));
const sagas = () => [...new Set(S.giochi.map(g => (g.saga || '').trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
const sagaList = n => S.giochi.filter(g => norm(g.saga) === norm(n)).sort((a, b) => (a.sagaN || 999) - (b.sagaN || 999) || a.titolo.localeCompare(b.titolo));
const raccOf = id => S.raccolte.find(r => r.id === id);
const mpOk = (g, m = V.mp) => m === 'tutti' || (g.multi || []).includes(m);
const inDays = n => n === 0 ? 'oggi' : n === 1 ? 'domani' : n > 0 ? `tra ${n} gg` : n === -1 ? 'ieri' : `${-n} gg fa`;

/* ---------- pezzi ---------- */
const tile = c => `<span class="tile" style="background:${c.col}" aria-hidden="true">${esc(c.sigla)}</span>`;
const statoPill = s => `<span class="pill st-${s}">${ST[s].breve}</span>`;
function gameRow(g){
  const c = conOf(g.con), bits = [];
  if (g.stato !== 'wish') bits.push(statoPill(g.stato));
  bits.push(`<span>${esc(c.sigla)} · ${g.formato === 'fisico' ? 'Fisico' : 'Digitale'}</span>`);
  if (g.origine === 'abbonamento') bits.push(`<span class="tag">${esc(g.abbo || 'Abbonamento')}</span>`);
  else if (g.origine === 'gratis') bits.push('<span class="tag">Gratis</span>');
  else if (g.origine === 'regalo') bits.push('<span class="tag">Regalo</span>');
  if (g.account && accounts().length > 1) bits.push(`<span class="tag">${esc(g.account)}</span>`);
  if (g.saga && V.saga === 'tutte') bits.push(`<span class="tag">${esc(g.saga)}${g.sagaN ? ` #${g.sagaN}` : ''}</span>`);
  else if (g.saga && g.sagaN) bits.push(`<span class="tag">#${g.sagaN}</span>`);
  if (g.edizione && g.edizione !== 'Standard') bits.push(`<span class="tag">${esc(g.edizione)}</span>`);
  if (g.dlc && g.dlc.length) bits.push(`<span class="tag">+${g.dlc.length} DLC</span>`);
  if ((g.multi || []).includes('locale')) bits.push('<span class="tag">In compagnia</span>');
  if (g.prestito) bits.push(`<span class="pill st-cento">Prestato a ${esc(g.prestito.a)}</span>`);
  if (g.venduto) bits.push(`<span class="pill st-mollato">Venduto</span>`);
  if (g.esce && !g.venduto && (g.stato === 'da' || g.stato === 'corso') && daysTo(g.esce) <= 30) bits.push(`<span class="pill ${daysTo(g.esce) <= 7 ? 'st-mollato' : 'st-cento'}">Esce dal catalogo ${inDays(daysTo(g.esce))}</span>`);
  if (g.esempio) bits.push('<span>esempio</span>');
  const right = g.stato === 'wish' ? (g.prezzoMax ? `<span class="num">≤ ${eur0.format(g.prezzoMax)}</span>` : '')
    : `${g.voto ? `<span class="stars" aria-label="${g.voto} stelle su 5">${stars(g.voto)}</span>` : ''}${g.trofei ? `<span class="num">🏆 ${g.trofei}%</span>` : ''}${S.sessione && S.sessione.gid === g.id ? '<span class="pill st-corso">⏱ ora</span>' : ''}${g.ore ? `<span class="num">${Math.round(g.ore)} h${g.durata && g.stato === 'corso' ? ` / ~${g.durata}` : ''}</span>` : g.durata && g.stato === 'da' ? `<span class="num">~${g.durata} h</span>` : ''}`;
  const pic = FOTO.get(g.id);
  return `<button class="g" data-game="${g.id}">${pic ? `<span class="cov"><img src="${pic}" alt="" loading="lazy"><i style="background:${c.col}"></i></span>` : tile(c)}<div class="main"><div class="t">${g.pref ? `<span style="color:var(--tomato);margin-right:4px" aria-label="Preferito">${HEART}</span>` : ''}${esc(g.titolo)}</div><div class="s">${bits.join('')}</div></div>${right ? `<span class="r">${right}</span>` : ''}</button>`;
}
function gameCard(g){
  const c = conOf(g.con), pic = FOTO.get(g.id);
  return `<button class="gc" data-game="${g.id}"><span class="cv" style="background:${pic ? 'var(--sunk)' : `linear-gradient(160deg, ${c.col}, ${c.col}cc)`}">${pic ? `<img src="${pic}" alt="" loading="lazy">` : `<span class="ttl">${esc(g.titolo)}</span>`}${g.stato !== 'wish' ? statoPill(g.stato) : ''}<span class="sg">${esc(c.sigla)}</span></span><span class="tt">${g.pref ? '♥ ' : ''}${esc(g.titolo)}</span></button>`;

const listOrGrid = l => V.view === 'griglia' ? `<div class="gridv">${l.map(gameCard).join('')}</div>` : `<div class="list">${l.map(gameRow).join('')}</div>`;
const viewToggle = () => `<div class="vt" role="group" aria-label="Vista"><button data-view="lista" aria-pressed="${V.view !== 'griglia'}">Elenco</button><button data-view="griglia" aria-pressed="${V.view === 'griglia'}">Copertine</button></div>`;
const sampleNote = () => hasSamples() ? `<div class="sample-note"><span>Stai vedendo giochi di esempio.</span><button data-act="clearSamples">Cancella esempi</button></div>` : '';
function sortGames(l){
  const by = {
    agg:(a, b) => (b.agg || '').localeCompare(a.agg || ''),
    az:(a, b) => a.titolo.localeCompare(b.titolo, 'it', {sensitivity:'base'}),
    voto:(a, b) => (b.voto || 0) - (a.voto || 0) || a.titolo.localeCompare(b.titolo),
    ore:(a, b) => (b.ore || 0) - (a.ore || 0) || a.titolo.localeCompare(b.titolo),
    con:(a, b) => conOf(a.con).nome.localeCompare(conOf(b.con).nome) || a.titolo.localeCompare(b.titolo)
  }[V.sort] || ((a, b) => 0);
  return l.sort(by);
}

function renderLib(){

  let l = base.filter(g => (V.saga === 'tutte' || norm(g.saga) === norm(V.saga)) && (V.acc === 'tutti' || g.account === V.acc) && (V.racc === 'tutte' || (g.racc || []).includes(V.racc)) && (V.con === 'tutte' || g.con === V.con) && (V.stato === 'tutti' || g.stato === V.stato) && (V.formato === 'tutti' || V.formato === 'venduti' || (V.formato === 'abbonamento' ? g.origine === 'abbonamento' : V.formato === 'prestati' ? !!g.prestito : g.formato === V.formato)));
  const lent = all.filter(g => g.prestito);
  if (q) l = l.filter(g => [g.titolo, g.saga, g.genere, g.note, g.account, g.edizione, ...(g.dlc || []), g.prestito ? g.prestito.a : ''].some(x => norm(x).includes(q)));
  if (V.saga !== 'tutte') l.sort((a, b) => (a.sagaN || 999) - (b.sagaN || 999) || a.titolo.localeCompare(b.titolo)); else sortGames(l);
  const used = S.console.filter(c => c.mia || all.some(g => g.con === c.id));
  const fin = all.filter(g => g.stato === 'finito' || g.stato === 'cento').length;

  <div class="filters">

  <button class="btn ghost wide" data-act="bulk">Aggiungi tanti giochi insieme</button>`;
}

  ${conIds.length > 1 ? `<div class="chips" role="group" aria-label="Console per il gioco a caso"><button class="chip" data-pcon="tutte" aria-pressed="${V.pickCon === 'tutte'}">Qualsiasi console</button>${conIds.map(id => { const c = conOf(id); return `<button class="chip" data-pcon="${id}" aria-pressed="${V.pickCon === id}"><span class="dot" style="background:${c.col}"></span>${esc(c.sigla)} <span class="c num">${da.filter(g => g.con === id).length}</span></button>`; }).join('')}</div>` : ''}` : ''}

    <div class="banner"><span>${st0.length === 1 ? 'Questo gioco è «in corso» ma non lo tocchi' : 'Questi giochi sono «in corso» ma non li tocchi'} da un po'. Lo riprendi o lo metti in pausa?</span></div>
    <div class="list">${st0.map(x => `<div class="crow" style="flex-wrap:wrap">${tile(conOf(x.g.con))}<div class="main"><div class="t">${esc(x.g.titolo)}</div><div class="s">Ultima volta ${Math.abs(daysTo(x.last))} giorni fa</div></div><div class="btnrow" style="width:100%"><button class="btn ghost" data-stale="riprendo:${x.g.id}" style="padding:8px">▶ Lo riprendo</button><button class="btn ghost" data-stale="pausa:${x.g.id}" style="padding:8px">⏸ In pausa</button></div></div>`).join('')}</div></section>` : ''}

const sortByRecent = l => l.sort((a, b) => (b.inizio || '').localeCompare(a.inizio || '') || a.titolo.localeCompare(b.titolo));

  const tot = all.reduce((t, g) => t + (g.prezzoMax || 0), 0);

let sheetEl = null;
function openSheet(html, mount){

let toastT, undoSnap = null;
function toast(msg){ $('#toast-t').textContent = msg; $('#toast-u').hidden = true; undoSnap = null; $('#toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => $('#toast').hidden = true, 2600); }
const snapshot = () => JSON.stringify(S);
function offerUndo(snap){ undoSnap = snap; $('#toast-u').hidden = false; $('#toast').hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { $('#toast').hidden = true; undoSnap = null; }, 6000); }
$('#toast-u').addEventListener('click', () => { if (!undoSnap) return; S = JSON.parse(undoSnap); undoSnap = null; save(); applyTheme(); closeSheet(); render(); toast('Ripristinato'); });
function twoTap(btn, label, fn){

    const snap = snapshot(); fn(); offerUndo(snap);
  });
}

const fmtNum1 = v => Number(v).toLocaleString('it-IT', {maximumFractionDigits:1});

  m = t.match(/^(\d+)\s*[:.h]\s*(\d{1,2})\s*(m|min|minuti)?$/);
  if (m && (t.includes(':') || t.includes('h'))) return +m[1] + Math.min(59, +m[2]) / 60;
  m = t.match(/^(\d+(?:[.,]\d+)?)\s*(h|ore|ora)?(?:\s*e?\s+(\d{1,2})\s*(m|min|minuti))?$/);
  if (m && (m[1] || m[3])) return parseFloat(m[1].replace(',', '.')) + (m[3] ? Math.min(59, +m[3]) / 60 : 0);
  m = t.match(/^(\d+)\s*(m|min|minuti)$/);
  if (m) return +m[1] / 60;
  return NaN;

function yearData(y){
  const all = S.giochi.filter(g => g.stato !== 'wish');
  const fin = all.filter(g => (g.stato === 'finito' || g.stato === 'cento') && g.fine && g.fine.startsWith(y)).sort((a, b) => a.fine.localeCompare(b.fine));
  const ses = all.flatMap(g => (g.sessioni || []).filter(x => x.data.startsWith(y)).map(x => ({g, ...x})));
  const minTot = ses.reduce((t, x) => t + x.min, 0);
  const byCon = {}; ses.forEach(x => byCon[x.g.con] = (byCon[x.g.con] || 0) + x.min);
  if (!ses.length) [...fin, ...all.filter(g => g.inizio && g.inizio.startsWith(y))].forEach(g => byCon[g.con] = (byCon[g.con] || 0) + 1);
  const topCon = Object.entries(byCon).sort((a, b) => b[1] - a[1])[0];
  const byGame = {}; ses.forEach(x => byGame[x.g.id] = (byGame[x.g.id] || 0) + x.min);
  const best = fin.slice().sort((a, b) => (b.voto || 0) - (a.voto || 0) || (b.ore || 0) - (a.ore || 0))[0] || (Object.keys(byGame).length ? S.giochi.find(g => g.id === Object.entries(byGame).sort((a, b) => b[1] - a[1])[0][0]) : null);
  const bought = all.filter(g => g.data && g.data.startsWith(y)), spent = bought.reduce((t, g) => t + (g.prezzo || 0), 0);
  const soldY = S.giochi.filter(g => g.venduto && g.venduto.data.startsWith(y)), ric = soldY.reduce((t, g) => t + (g.venduto.prezzo || 0), 0);
  const gen = {}; [...fin, ...all.filter(g => g.inizio && g.inizio.startsWith(y))].forEach(g => { if (g.genere) gen[g.genere] = (gen[g.genere] || 0) + 1; });
  const topGen = Object.entries(gen).sort((a, b) => b[1] - a[1])[0];
  const byM = {}; ses.forEach(x => { const m = x.data.slice(5, 7); byM[m] = (byM[m] || 0) + x.min; });
  const topM = Object.entries(byM).sort((a, b) => b[1] - a[1])[0];
  return {fin, minTot, topCon:topCon ? conOf(topCon[0]) : null, best, bought, spent, ric, soldN:soldY.length, topGen:topGen ? topGen[0] : null, topM:topM ? new Date(+y, +topM[0] - 1, 1).toLocaleDateString('it-IT', {month:'long'}) : null, cento:fin.filter(g => g.stato === 'cento').length};
}

function randomSheet(exclude = []){
  const pool = library().filter(g => g.stato === 'da' && (V.pickCon === 'tutte' || g.con === V.pickCon) && durOk(g) && mpOk(g));
  if (!pool.length) return toast('Nessun gioco da iniziare qui');
  let cand = pool.filter(g => !exclude.includes(g.id)); if (!cand.length){ cand = pool; exclude = []; }
  const w = cand.map(g => (g.origine === 'abbonamento' ? 2 : 1) + (g.pref ? 1 : 0) + (g.esce && daysTo(g.esce) <= 30 ? 2 : 0));
  let r = Math.random() * w.reduce((a, b) => a + b, 0), g = cand[0];
  for (let i = 0; i < cand.length; i++){ r -= w[i]; if (r <= 0){ g = cand[i]; break; } }
  const c = conOf(g.con), pic = FOTO.get(g.id);
  openSheet(`<p style="text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600">Stasera giochi a…</p>

function exportSheet(withFoto){
  const fotos = withFoto ? Object.fromEntries([...FOTO].filter(([id]) => S.giochi.some(g => g.id === id))) : null;
  const json = JSON.stringify({app:'gelu-inc-gelus-collection', esportato:new Date().toISOString(), ...S, ...(fotos ? {fotoBackup:fotos} : {})}, withFoto ? null : null, withFoto ? 0 : 2), name = `gelus-collection-${today()}${withFoto ? '-con-foto' : ''}.json`;
  const nF = FOTO.size, kb = Math.round(json.length / 1024);
  openSheet(`<h2>Esporta backup</h2><p>Salvalo su Drive o mandalo a te stesso. File di circa ${kb > 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : kb + ' KB'}.</p>
    ${nF ? `<label class="check"><input type="checkbox" id="x-foto" ${withFoto ? 'checked' : ''}><span>Includi le ${nF} foto dei giochi<br><span class="muted" style="font-size:13px">Il file diventa più pesante, ma sul telefono nuovo ritrovi anche le foto.</span></span></label>` : ''}
    <button class="btn wide" id="x-sh" hidden>Condividi su Drive, email, WhatsApp…</button>
    <button class="btn ghost wide" id="x-dl">Scarica file</button>
    <button class="btn ghost wide" id="x-cp">Copia testo del backup</button>
    <div class="field"><label for="x-ta">Backup</label><textarea id="x-ta" class="mono" readonly>${esc(json.length > 300000 ? json.slice(0, 300000) + '\n… (testo troppo lungo da mostrare: usa Condividi o Copia)' : json)}</textarea></div>
    <button class="btn ghost wide" data-close>Chiudi</button>`, root => {
    const xf = root.querySelector('#x-foto'); if (xf) xf.addEventListener('change', () => exportSheet(xf.checked));
    const sh = root.querySelector('#x-sh'); sh.hidden = !(navigator.canShare && window.File);
    sh.addEventListener('click', async () => {
      try { let f = new File([json], name, {type:'application/json'}); if (!navigator.canShare({files:[f]})) f = new File([json], name.replace(/\.json$/, '.txt'), {type:'text/plain'}); if (!navigator.canShare({files:[f]})) throw 0; await navigator.share({files:[f], title:name}); toast('Condiviso'); }
      catch(e){ if (e && e.name === 'AbortError') return; toast('Condivisione non disponibile qui. Usa Scarica o Copia.'); }
    });
    root.querySelector('#x-dl').addEventListener('click', () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([json], {type:'application/json'})); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast('Download avviato. Se non parte, usa Copia.'); } catch(_){ toast('Download non disponibile qui. Usa Copia.'); } });
    root.querySelector('#x-cp').addEventListener('click', () => { const ta = root.querySelector('#x-ta'), fb = () => { ta.focus(); ta.select(); toast('Testo selezionato: copialo dal menu'); }; try { navigator.clipboard.writeText(json).then(() => toast('Copiato'), fb); } catch(_){ fb(); } });
  });
}

  const pc = e.target.closest('[data-pcon]'); if (pc){ V.pickCon = pc.dataset.pcon; return keepScroll(render); }
  const wc = e.target.closest('[data-wcon]'); if (wc){ V.wishCon = wc.dataset.wcon; return keepScroll(render); }
  const stl = e.target.closest('[data-stale]'); if (stl){ const [k, id] = stl.dataset.stale.split(':'), g = S.giochi.find(x => x.id === id); if (g){ const snap = snapshot(); if (k === 'pausa'){ g.stato = 'pausa'; toast(`${g.titolo} in pausa`); } else { g.ripreso = today(); toast(`Buon ritorno su ${g.titolo}!`); } save(); keepScroll(render); offerUndo(snap); } return; }
  const vw = e.target.closest('[data-view]'); if (vw){ V.view = vw.dataset.view; try { localStorage.setItem(KEY + '-view', V.view); } catch(_){} return keepScroll(render); }
  const mp = e.target.closest('[data-mp]'); if (mp){ V.mp = mp.dataset.mp; return keepScroll(render); }
  const abe = e.target.closest('[data-abedit]'); if (abe) return formAbbo(abe.dataset.abedit);
  const rce = e.target.closest('[data-rcedit]'); if (rce) return formRacc(rce.dataset.rcedit);
  const dr = e.target.closest('[data-dur]'); if (dr){ V.dur = dr.dataset.dur; return keepScroll(render); }
  const ae = e.target.closest('[data-accedit]'); if (ae) return accSheet(ae.dataset.accedit);
  const ce = e.target.closest('[data-cedit]'); if (ce) return formCon(ce.dataset.cedit);
  const th = e.target.closest('[data-tema]'); if (th){ S.tema = th.dataset.tema; save(); applyTheme(); return render(); }
  const a = e.target.closest('[data-act]'); if (!a) return;
  const act = a.dataset.act;
  if (act === 'random') randomSheet();
  else if (act === 'stopTimer') stopSheet();
  else if (act === 'year') yearSheet(a.dataset.y);
  else if (act === 'newAbbo') formAbbo();
  else if (act === 'goal') goalSheet();
  else if (act === 'csv') csvSheet();
  else if (act === 'showLent'){ Object.assign(V, {formato:'prestati', con:'tutte', stato:'tutti', racc:'tutte', acc:'tutti', q:''}); render(); }
  else if (act === 'bulk') bulkSheet();
  else if (act === 'newWish') formGame(null, {stato:'wish'});
  else if (act === 'newCon') formCon();
  else if (act === 'export') exportSheet(false);
  else if (act === 'restore') restoreSheet();
  else if (act === 'clearSamples'){ const snap = snapshot(); S.giochi = S.giochi.filter(g => !g.esempio); fotoCleanup(); save(); render(); toast('Esempi cancellati'); offerUndo(snap); }
  else if (act === 'wipe'){
    if (a.dataset.armed){ const snap = snapshot(); S.giochi = []; fotoCleanup(); save(); render(); toast('Giochi cancellati'); offerUndo(snap); }
    else { a.dataset.armed = '1'; a.textContent = 'Tocca di nuovo per cancellare tutto'; setTimeout(() => { if (a.isConnected){ delete a.dataset.armed; a.textContent = 'Cancella tutti i giochi'; } }, 3500); }
  }
});
$('#view').addEventListener('change', e => { const m = e.target.closest('[data-mia]'); if (m){ const c = S.console.find(x => x.id === m.dataset.mia); if (c){ c.mia = m.checked; save(); } } });

/* ---------- installazione ---------- */
const installBtn = $('#installBtn');
let deferredPrompt = null;
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: minimal-ui)').matches || navigator.standalone === true;
const markInstalled = v => { try { v ? localStorage.setItem(KEY_INST, '1') : localStorage.removeItem(KEY_INST); } catch(_){} };
const wasInstalled = () => { try { return localStorage.getItem(KEY_INST) === '1'; } catch(_){ return false; } };
function updateInstallBtn(){ installBtn.hidden = isStandalone() || wasInstalled(); }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; markInstalled(false); updateInstallBtn(); const n = document.getElementById('in-now'); if (n) n.hidden = false; });
window.addEventListener('appinstalled', () => { deferredPrompt = null; markInstalled(true); updateInstallBtn(); toast('App installata'); });
window.matchMedia('(display-mode: standalone)').addEventListener?.('change', updateInstallBtn);
async function doInstall(){
  const ev = deferredPrompt; if (!ev) return false;
  deferredPrompt = null;
  try { ev.prompt(); const r = await ev.userChoice; if (r.outcome === 'accepted'){ markInstalled(true); updateInstallBtn(); closeSheet(); } } catch(_){}
  return true;
}
async function installChecks(){
  const ua = navigator.userAgent, out = [], add = (ok, t, help) => out.push({ok, t, help});
  add(location.protocol === 'https:', 'Indirizzo sicuro (https)', 'Apri l\'app dall\'indirizzo https://gelu92.github.io/…');
  const inApp = /; wv\)|FBAN|FBAV|Instagram|GitHub|WhatsApp/i.test(ua), chrome = /Chrome\//.test(ua) && !/EdgA|OPR|SamsungBrowser|Firefox/i.test(ua);
  add(chrome && !inApp, 'Aperta in Chrome', inApp ? 'Sei nel browser interno di un\'altra app: menu ⋮ → «Apri in Chrome».' : 'Apri l\'indirizzo con Google Chrome.');
  let man = null; try { const r = await fetch(document.querySelector('link[rel=manifest]').href, {cache:'no-store'}); if (r.ok) man = await r.json(); } catch(_){}
  add(!!(man && man.id), 'Manifest trovato' + (man && man.id ? ` (${man.id})` : ''), 'Il file manifest.json non è nella stessa cartella di index.html.');
  let icons = false; try { const r = await fetch('icon-512.png', {cache:'no-store'}); icons = r.ok; } catch(_){}
  add(icons, 'Icone trovate', 'I file icon-192.png e icon-512.png non sono nella stessa cartella di index.html.');
  let sw = false; try { const reg = 'serviceWorker' in navigator && await navigator.serviceWorker.getRegistration(); sw = !!(reg && (reg.active || reg.waiting || reg.installing)); } catch(_){}
  add(sw, 'Funzionamento offline attivo', 'Il file sw.js non è nella stessa cartella oppure la pagina va ricaricata.');
  add(!!deferredPrompt, 'Chrome pronto a installare', 'Tocca qualche schermata e lascia l\'app aperta circa 30 secondi: si attiva da solo. Se avevi già rifiutato l\'installazione, Chrome per un po\' non la ripropone: usa il menu ⋮.');
  return out;
}
function installSheet(){
  openSheet(`<h2>Installa ${APP}</h2>
    <button class="btn wide" id="in-now" hidden>Installa ora</button>
    <div id="in-ck" class="list"><div class="crow"><div class="main"><div class="t">Controllo in corso…</div></div></div></div>
    <div class="sub">Oppure dal menu di Chrome</div>
    <ol class="steps"><li>Tocca il menu <b>⋮</b> in alto a destra.</li><li>Scegli <b>Installa app</b> (o <b>Aggiungi a schermata Home</b>, poi <b>Installa</b>).</li><li>Conferma.</li></ol>
    <button class="btn ghost wide" data-close>Chiudi</button>`, root => {
    const now = root.querySelector('#in-now'); now.addEventListener('click', doInstall);
    let timer = null;
    const tick = async () => {
      if (!root.isConnected){ clearInterval(timer); return; }
      now.hidden = !deferredPrompt;
      const l = await installChecks(); if (!root.isConnected) return;
      root.querySelector('#in-ck').innerHTML = l.map((c, i) => `<div class="crow"><div class="main"><div class="t">${c.t}</div>${c.ok ? '' : `<div class="s">${c.help}</div>`}</div>${c.ok ? '<span class="pill st-finito">OK</span>' : `<span class="pill st-cento">${i === l.length - 1 ? 'In attesa' : 'Da sistemare'}</span>`}</div>`).join('');
    };
    tick(); timer = setInterval(tick, 2000);
  });
}
installBtn.addEventListener('click', async () => { if (!(await doInstall())) installSheet(); });
if (isStandalone()) markInstalled(true);
updateInstallBtn();
if ('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- scorciatoie ---------- */
function handleAzione(){
  let a = null; try { a = new URLSearchParams(location.search).get('azione'); } catch(_){}
  if (!a) return false;
  try { history.replaceState(null, '', location.pathname); } catch(_){}
  if (a === 'nuovo'){ goTab('lib'); formGame(); }
  else if (a === 'caso'){ goTab('backlog'); randomSheet(); }
  else if (a === 'timer'){ if (S.sessione) stopSheet(); else goTab('backlog'); }
  else return false;
  return true;
}

/* ---------- avvio ---------- */
load();
applyTheme();
render();
fotoLoadAll().then(() => { if (FOTO.size) keepScroll(render); });
if (!handleAzione()){ if (S.onboard === 'pending') onboarding(); else maybeRemind(); }
})();
</script>
